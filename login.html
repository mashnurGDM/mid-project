<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Need a Room - Shohoshi</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<!-- header -->
<div class="header">
    <div class="logo"> Shohoshi</div>
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="ROOMS.HTML">Find room</a>
        <a href="ROOMS.HTML">Post room</a>
        <a href="login.html">Login</a>
    </div>

</div>
<!-- mainarea -->
<div class="mainarea">
    <div class="formwrapper">
        <div class="title">
            Need a room?
        </div>
        <!-- form -->
        <div class="formbox">
            <h2>About you</h2>
            <div class="inputgroup">
                <label>Full Name</label>
                <input type="text">
            </div>
            <!-- Loc -->
            <div class="inputgroup">
                <label>Where are you looking?</label>
                <input type="text">

            </div>
            <!-- proprty -->
            <div class="inputgroup">
                <label>Property type</label>
                <input type="text">
            </div>
            <!-- bud -->
            <div class="inputgroup">
                <label>Budget</label>
               <input type="text">
            </div>
            <!-- gender -->
            <div class="inputgroup">
                <label>Gendar</label>
               <input type="text">
            </div>



            <!-- lil box -->
            <div class="checkboxarea">
                <div class="checkline">
                    <input type="checkbox" checked>
                    <span>Bills included</span>
                </div>
                <p>Whether all bills are included in the rent</p>
            </div>
        </div>
        <!-- login -->
        <div class="loginbox">
            <div class="inputgroup">
                <label>Email</label>
                <input type="email">
            </div>
            <div class="inputgroup">
                <label>Password</label>
                <input type="text">
            </div>
            <button>Create Profile</button>
        </div>

    </div>
</div>





<!-- FOOTER -->

<div class="footer">

    <div>Terms & Condition</div>
    <div>Privacy Policy</div>
    <div>About Us</div>
    <div>© 2026 Shohoshi</div>

</div>


</body>
</html>
